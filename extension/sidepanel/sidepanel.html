<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobberAI Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fa;
    color: #202124;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #1a73e8;
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .source-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.25);
  }
  .job-info {
    background: white;
    border-bottom: 1px solid #e8eaed;
    padding: 10px 16px;
    flex-shrink: 0;
  }
  .job-title { font-size: 14px; font-weight: 600; color: #202124; }
  .job-company { font-size: 12px; color: #5f6368; margin-top: 2px; }
  .stats-bar {
    display: flex;
    gap: 16px;
    padding: 8px 16px;
    background: #e8f5e9;
    border-bottom: 1px solid #c8e6c9;
    font-size: 11px;
    color: #2e7d32;
    flex-shrink: 0;
  }
  .tab-bar {
    display: flex;
    background: white;
    border-bottom: 1px solid #e8eaed;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    cursor: pointer;
    font-size: 12px;
    color: #5f6368;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
  .tab:hover { background: #f8f9fa; }
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  /* Fields tab */
  .field-row {
    background: white;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .field-label {
    font-size: 11px;
    color: #80868b;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .field-source {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    background: #e8f0fe;
    color: #1a73e8;
  }
  .field-source.claude { background: #f3e5f5; color: #7b1fa2; }
  .field-value {
    font-size: 13px;
    color: #202124;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    resize: vertical;
    font-family: inherit;
    padding: 0;
  }
  .field-value:focus {
    background: #f8f9fa;
    padding: 4px;
    border-radius: 4px;
    margin: -4px;
  }
  /* ATS tab */
  .ats-section { margin-bottom: 14px; }
  .ats-header { font-size: 12px; font-weight: 600; color: #202124; margin-bottom: 8px; }
  .kw-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 0;
    border-bottom: 1px solid #f1f3f4;
    font-size: 12px;
  }
  .kw-check { color: #0f9d58; font-weight: 700; }
  .kw-miss { color: #ea4335; }
  /* Cover letter tab */
  #coverLetterText {
    width: 100%;
    min-height: 200px;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    outline: none;
  }
  #coverLetterText:focus { border-color: #1a73e8; }
  .cl-btn {
    width: 100%;
    padding: 9px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: #1a73e8;
    color: white;
  }
  .cl-btn:hover { background: #1557b0; }
  .cl-btn.secondary { background: #f1f3f4; color: #202124; }
  /* Footer actions */
  .footer {
    padding: 12px 16px;
    background: white;
    border-top: 1px solid #e8eaed;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }
  .action-btn {
    padding: 10px 4px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-prev { background: #f1f3f4; color: #5f6368; }
  .btn-next { background: #1a73e8; color: white; }
  .btn-submit { background: #0f9d58; color: white; }
  .btn-prev:hover { background: #e8eaed; }
  .btn-next:hover { background: #1557b0; }
  .btn-submit:hover { background: #0b7a45; }
  .empty-state {
    text-align: center;
    color: #80868b;
    padding: 40px 20px;
    font-size: 13px;
    line-height: 1.6;
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="header">
  <span>🤖</span>
  <h1 id="panelTitle">JobberAI</h1>
  <span class="source-badge" id="sourceBadge">Ready</span>
</div>
<div class="job-info" id="jobInfo" style="display:none">
  <div class="job-title" id="jobTitle"></div>
  <div class="job-company" id="jobCompany"></div>
</div>
<div class="stats-bar" id="statsBar" style="display:none">
  <span id="statFilled">0 filled</span>
  <span id="statClaude">0 via Claude</span>
  <span id="statSkipped">0 skipped</span>
</div>
<div class="tab-bar">
  <div class="tab active" data-tab="fields">Fields</div>
  <div class="tab" data-tab="ats">ATS</div>
  <div class="tab" data-tab="cover">Cover Letter</div>
</div>
<div class="scroll-area" id="scrollArea">
  <!-- Fields tab -->
  <div id="tabFields">
    <div class="empty-state">
      <div class="empty-icon">✨</div>
      Click <b>Autofill</b> on a job application page to start.
    </div>
  </div>
  <!-- ATS tab -->
  <div id="tabAts" style="display:none">
    <div class="ats-section">
      <div class="ats-header">Keyword Match</div>
      <div id="atsList">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          Autofill a job first to see ATS keyword analysis.
        </div>
      </div>
    </div>
  </div>
  <!-- Cover Letter tab -->
  <div id="tabCover" style="display:none">
    <textarea id="coverLetterText" placeholder="Click 'Generate' to create a targeted cover letter..."></textarea>
    <button class="cl-btn" id="btnGenerateCL">Generate with Claude</button>
    <button class="cl-btn secondary" id="btnFillCL" style="margin-top:4px">Fill Cover Letter Field</button>
  </div>
</div>
<div class="footer">
  <button class="action-btn btn-prev" id="btnPrev">← Prev</button>
  <button class="action-btn btn-next" id="btnNext">Next →</button>
  <button class="action-btn btn-submit" id="btnSubmit">Submit ▶</button>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
