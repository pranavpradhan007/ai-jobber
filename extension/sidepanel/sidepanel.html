<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobberAI Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fa;
    color: #202124;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: #1a73e8;
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .source-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.25);
  }
  .job-info {
    background: white;
    border-bottom: 1px solid #e8eaed;
    padding: 10px 16px;
    flex-shrink: 0;
  }
  .job-title { font-size: 14px; font-weight: 600; color: #202124; }
  .job-company { font-size: 12px; color: #5f6368; margin-top: 2px; }
  .stats-bar {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 16px;
    background: #e8f5e9;
    border-bottom: 1px solid #c8e6c9;
    flex-shrink: 0;
  }
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  /* Fields tab */
  .field-row {
    background: white;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .field-label {
    font-size: 11px;
    color: #80868b;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .field-source {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 4px;
    background: #e8f0fe;
    color: #1a73e8;
  }
  .field-source.claude { background: #f3e5f5; color: #7b1fa2; }
  .field-value {
    font-size: 13px;
    color: #202124;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    resize: vertical;
    font-family: inherit;
    padding: 0;
  }
  .field-value:focus {
    background: #f8f9fa;
    padding: 4px;
    border-radius: 4px;
    margin: -4px;
  }
  /* Footer actions */
  .footer {
    padding: 10px 16px;
    background: white;
    border-top: 1px solid #e8eaed;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn-auto-apply {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    background: linear-gradient(135deg, #7b1fa2, #1a73e8);
    color: white;
    letter-spacing: 0.3px;
    transition: opacity 0.15s;
  }
  .btn-auto-apply:hover { opacity: 0.88; }
  .btn-auto-apply:disabled { opacity: 0.5; cursor: default; }
  .btn-stop {
    display: none;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #ea4335;
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-stop:hover { opacity: 0.88; }
  .footer-manual {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .action-btn {
    padding: 8px 4px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .btn-prev { background: #f1f3f4; color: #5f6368; }
  .btn-next { background: #1a73e8; color: white; }
  .btn-submit { background: #0f9d58; color: white; }
  .btn-prev:hover { background: #e8eaed; }
  .btn-next:hover { background: #1557b0; }
  .btn-submit:hover { background: #0b7a45; }
  #autoApplyProgress {
    font-size: 10px;
    color: #5f6368;
    text-align: center;
    min-height: 14px;
  }
  .empty-state {
    text-align: center;
    color: #80868b;
    padding: 40px 20px;
    font-size: 13px;
    line-height: 1.6;
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* Tabs */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid #e8eaed;
    background: white;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 4px;
    border: none;
    background: none;
    font-size: 11px;
    font-weight: 600;
    color: #80868b;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab-btn.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ATS keyword chip */
  .kw-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px; }
  .kw-chip {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
  }
  .kw-chip.present { background: #e8f5e9; color: #1b5e20; }
  .kw-chip.missing { background: #fce8e6; color: #c62828; }
  .kw-section-title { font-size: 10px; color: #80868b; padding: 10px 12px 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  /* History rows */
  .history-row {
    padding: 10px 12px;
    border-bottom: 1px solid #f1f3f4;
    font-size: 12px;
  }
  .history-row .h-company { font-weight: 600; color: #202124; }
  .history-row .h-title   { color: #5f6368; margin-top: 1px; }
  .history-row .h-date    { font-size: 10px; color: #80868b; margin-top: 2px; }

  /* Cover letter area */
  #coverLetterText {
    width: 100%;
    min-height: 160px;
    font-size: 12px;
    line-height: 1.6;
    border: 1px solid #e8eaed;
    border-radius: 6px;
    padding: 10px;
    resize: vertical;
    font-family: inherit;
    color: #202124;
  }
  .cover-btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .cover-btns button {
    flex: 1;
    padding: 7px;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .cover-btns button:hover { opacity: 0.85; }
  #btnGenCover  { background: #7b1fa2; color: white; }
  #btnCopyCover { background: #1a73e8; color: white; }
  #btnFillCover { background: #0f9d58; color: white; }
</style>
</head>
<body>
<div class="header">
  <span>🤖</span>
  <h1 id="panelTitle">JobberAI</h1>
  <span class="source-badge" id="sourceBadge">Ready</span>
</div>
<div class="job-info" id="jobInfo" style="display:none">
  <div class="job-title" id="jobTitle"></div>
  <div class="job-company" id="jobCompany"></div>
</div>
<div class="stats-bar" id="statsBar" style="display:none">
  <span id="statApplied" style="font-size:18px;font-weight:700;color:#1b5e20">—</span>
  <span style="font-size:11px;color:#2e7d32;align-self:flex-end;padding-bottom:1px">Applied (Gmail confirmed)</span>
  <span id="statAppliedSub" style="font-size:10px;color:#80868b;margin-left:auto;align-self:flex-end"></span>
</div>
<div id="claudeStatusBar" style="display:none;padding:8px 16px;border-bottom:1px solid #e8eaed;flex-shrink:0;background:#fafafa">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
    <span id="claudeStatusDot" style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#bdbdbd"></span>
    <div id="claudeStatusText" style="font-weight:600;color:#5f6368;font-size:11px">Claude: waiting</div>
  </div>
  <div id="claudeActivityLog" style="font-size:10px;font-family:monospace;line-height:1.6;color:#5f6368;max-height:90px;overflow-y:auto;padding-left:16px"></div>
</div>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="fields">Fields</button>
  <button class="tab-btn" data-tab="keywords">Keywords</button>
  <button class="tab-btn" data-tab="cover">Cover Letter</button>
  <button class="tab-btn" data-tab="history">History</button>
</div>
<div class="scroll-area" id="scrollArea">
  <!-- Fields tab -->
  <div id="tabFields" class="tab-panel active">
    <div class="empty-state">
      <div class="empty-icon">✨</div>
      Click <b>Autofill</b> on a job application page to start.
    </div>
  </div>

  <!-- Keywords tab -->
  <div id="tabKeywords" class="tab-panel">
    <div class="empty-state" id="kwEmptyState">
      <div class="empty-icon">🔑</div>
      Autofill a job to see ATS keyword matches.
    </div>
    <div id="kwPresent" style="display:none">
      <div class="kw-section-title">In Your Profile</div>
      <div class="kw-row" id="kwPresentChips"></div>
    </div>
    <div id="kwMissing" style="display:none">
      <div class="kw-section-title">Missing — Add to Resume</div>
      <div class="kw-row" id="kwMissingChips"></div>
    </div>
  </div>

  <!-- Cover Letter tab -->
  <div id="tabCover" class="tab-panel" style="padding:12px">
    <div class="cover-btns">
      <button id="btnGenCover">Generate</button>
      <button id="btnCopyCover">Copy</button>
      <button id="btnFillCover">Fill Form</button>
    </div>
    <textarea id="coverLetterText" placeholder="Click Generate to draft a tailored cover letter for this job…"></textarea>
    <div id="coverStatus" style="font-size:10px;color:#80868b;margin-top:4px"></div>
  </div>

  <!-- History tab -->
  <div id="tabHistory" class="tab-panel">
    <div class="empty-state" id="histEmptyState">
      <div class="empty-icon">📋</div>
      No applications logged yet.
    </div>
    <div id="historyList"></div>
  </div>
</div>
<div class="footer">
  <button class="btn-auto-apply" id="btnAutoApply">⚡ Auto Apply</button>
  <button class="btn-stop" id="btnStop">⏹ Stop</button>
  <div id="autoApplyProgress"></div>
  <div class="footer-manual">
    <button class="action-btn btn-prev" id="btnPrev">← Prev</button>
    <button class="action-btn btn-next" id="btnNext">Next →</button>
    <button class="action-btn btn-submit" id="btnSubmit">Submit ▶</button>
  </div>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
