<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobberAI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fff;
    color: #202124;
  }
  .header {
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    color: white;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo { font-size: 22px; }
  .title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .subtitle { font-size: 11px; opacity: 0.8; margin-top: 1px; }
  .body { padding: 16px; }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #f8f9fa;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 12px;
    color: #5f6368;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #34a853;
    flex-shrink: 0;
  }
  .status-dot.orange { background: #fbbc04; }
  .status-dot.red { background: #ea4335; }
  #statusText { flex: 1; }
  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .btn-primary {
    background: #1a73e8;
    color: white;
  }
  .btn-primary:hover { background: #1557b0; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: #b0bec5; cursor: not-allowed; }
  .btn-secondary {
    background: #f1f3f4;
    color: #202124;
    font-size: 13px;
    padding: 9px;
  }
  .btn-secondary:hover { background: #e8eaed; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider { height: 1px; background: #e8eaed; margin: 12px 0; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    text-align: center;
    padding: 8px 4px;
    background: #f8f9fa;
    border-radius: 8px;
  }
  .stat-num { font-size: 20px; font-weight: 700; color: #1a73e8; }
  .stat-label { font-size: 10px; color: #80868b; margin-top: 2px; }
  .footer {
    padding: 10px 16px;
    border-top: 1px solid #e8eaed;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer a {
    font-size: 11px; color: #1a73e8; text-decoration: none;
    cursor: pointer;
  }
  .footer a:hover { text-decoration: underline; }
  .api-warning {
    background: #fff3e0;
    border: 1px solid #ffb300;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #e65100;
    margin-bottom: 12px;
    display: none;
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">🤖</div>
  <div>
    <div class="title">JobberAI</div>
    <div class="subtitle">Claude-powered autofill</div>
  </div>
</div>
<div class="body">
  <div class="api-warning" id="apiWarning">
    No API key set. <a id="goSettings">Configure in Settings →</a>
  </div>
  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Ready</span>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="statFilled">0</div>
      <div class="stat-label">Filled</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statClaude">0</div>
      <div class="stat-label">Claude</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statApplied">0</div>
      <div class="stat-label">Applied</div>
    </div>
  </div>
  <button class="btn btn-primary" id="btnAutofill">
    <div class="spinner" id="spinner"></div>
    <span id="btnText">✨ Autofill</span>
  </button>
  <button class="btn btn-secondary" id="btnPanel">📋 Review Panel</button>
</div>
<div class="footer">
  <a id="goOptions">Settings</a>
  <a id="goTracker">Applications</a>
</div>
<script src="popup.js"></script>
</body>
</html>
